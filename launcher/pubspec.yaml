name: flatkit_launcher
description: A keyboard-driven application launcher for KDE Plasma, built on flatkit.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flatkit:
    path: ..
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
