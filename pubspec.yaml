name: flatkit
description: Flat Flutter widgets with instant feedback and no ripples, highlights or animated menus.
version: 0.1.0
publish_to: 'none'
repository: https://github.com/codegod100/flutterkit

environment:
  sdk: ^3.5.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
