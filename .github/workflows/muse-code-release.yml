name: Muse Code release

# Builds the Muse Code app for Linux, macOS, Windows and the web on every
# push to main that touches it. Desktop builds go to the rolling
# `muse-code-latest` release; the web build goes to the gh-pages branch, served by GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'apps/muse_code/**'
      - 'lib/**'
      - 'fonts/**'
      - 'pubspec.yaml'
      - '.github/workflows/muse-code-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muse-code-release
  cancel-in-progress: true

env:
  APP: apps/muse_code

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: ${{ env.APP }}
        run: |
          flutter build linux --release
          tar -C build/linux/x64/release/bundle -czf $GITHUB_WORKSPACE/muse-code-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: muse-code-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: ${{ env.APP }}
        run: |
          flutter build macos --release
          ditto -c -k --keepParent "build/macos/Build/Products/Release/Muse Code.app" $GITHUB_WORKSPACE/muse-code-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: muse-code-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: ${{ env.APP }}
        shell: pwsh
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $env:GITHUB_WORKSPACE\muse-code-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: muse-code-windows-x64.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: ${{ env.APP }}
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.APP }}/build/web
          force_orphan: true

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete muse-code-latest --yes --cleanup-tag || true
          gh release create muse-code-latest --target "$GITHUB_SHA" \
            --title "Muse Code (latest)" \
            --notes "Built from $GITHUB_SHA. The web version is at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

          macOS: the app is unsigned, so right-click it and choose Open the first time.
          Linux: extract and run ./muse_code (needs GTK 3).
          Windows: extract and run muse_code.exe." \
            muse-code-linux-x64.tar.gz muse-code-macos.zip muse-code-windows-x64.zip
